<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>FantaManager</title>
<style>
  :root {
    --bg: #000;
    --field: #181b20;
    --text-1: #f0f2f4;
    --text-2: #c3c8ce;
    --text-3: #a9afb6;
    --text-4: #949aa1;
    --hairline: rgba(255,255,255,0.13);
    --edge: rgba(255,255,255,0.09);
    --piano: #8b83e6;
    --live: #35b1a4;
    --neg: #e0655c;
    --pos: #4cc38a;
    --c1: 74px;   /* colonna reparto */
    --cn: 70px;   /* colonne numeriche */
    --gc: 16px;   /* gap fra colonne */
    --padT: 20px; /* padding orizzontale della card tabella */
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text-1);
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; padding: 26px 24px 60px;
  }
  .wrap { max-width: 1400px; margin: 0 auto; }

  .summaries { display: flex; gap: 18px; margin-bottom: 22px; align-items: stretch; flex-wrap: wrap; }
  .card {
    border-radius: 12px; overflow: hidden;
    background: rgba(255,255,255,0.045); box-shadow: inset 0 0 0 1px var(--edge);
  }

  /* label testuale dei crediti, eredita il colore del contesto */
  .cr { font-size: 0.7em; letter-spacing: 0.03em; font-weight: 500; }

  /* ——— colonna totali ——— */
  .totali { flex: 0 0 320px; min-width: 280px; display: flex; flex-direction: column; padding: 15px 18px 14px; }
  .k { display: block; font-size: 11px; color: var(--text-4); letter-spacing: 0.1em; }

  .residuo .v {
    display: flex; align-items: baseline; gap: 8px; margin-top: 5px;
    font-size: 40px; font-weight: 400; letter-spacing: -0.025em; font-variant-numeric: tabular-nums;
  }
  .residuo .v .cr { font-size: 15px; color: var(--text-4); font-weight: 400; }
  .rtop { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  .max { text-align: right; padding-bottom: 5px; }
  .max .mv {
    display: flex; align-items: baseline; justify-content: flex-end; gap: 5px; margin-top: 3px;
    font-size: 21px; font-weight: 500; letter-spacing: -0.015em; font-variant-numeric: tabular-nums;
  }
  .max .mv .cr { font-size: 12px; color: var(--text-4); font-weight: 400; }
  .residuo .v.neg { color: var(--neg); }

  .sep { height: 1px; background: var(--edge); margin: 13px 0 1px; }

  .riga { display: flex; align-items: center; gap: 14px; padding: 8px 0; }
  .riga .rk { font-size: 14px; color: var(--text-4); letter-spacing: 0.08em; }
  .riga .rv { margin-left: auto; font-size: 15px; color: var(--text-2); font-variant-numeric: tabular-nums; }
  input.budget {
    margin-left: auto; width: 86px; height: 34px; border: none; outline: none; border-radius: 8px;
    background: var(--field); color: var(--text-1); font: inherit; font-size: 16px;
    font-weight: 500; text-align: center; padding: 0 8px; font-variant-numeric: tabular-nums;
    box-shadow: inset 0 0 0 1px var(--edge);
  }
  input.budget:focus { box-shadow: inset 0 0 0 1.5px var(--piano); }

  .track { height: 2px; border-radius: 1px; background: rgba(255,255,255,0.1); margin-bottom: 14px; }
  .track i { display: block; height: 100%; border-radius: 1px; transition: width .18s; }
  .totali .track { height: 3px; border-radius: 2px; margin: 3px 0 0; }

  .azioni { margin-top: auto; padding-top: 16px; display: flex; gap: 10px; align-items: center; }
  .azioni button { height: 38px; border-radius: 10px; cursor: pointer; font: inherit; font-size: 14px; }
  .azioni .az {
    color: var(--text-1); background: rgba(255,255,255,0.05); border: 1px solid var(--edge); padding: 0 14px;
  }
  .azioni .az.primaria { flex: 1; }
  .azioni .az:hover { border-color: rgba(255,255,255,0.2); }
  .azioni .az b { font-weight: 500; color: var(--text-4); margin-left: 5px; font-variant-numeric: tabular-nums; }
  .ico {
    width: 40px; height: 40px; border-radius: 10px; cursor: pointer; padding: 0; flex: none;
    border: 1px solid var(--edge); background: rgba(255,255,255,0.05); color: var(--text-2);
    display: flex; align-items: center; justify-content: center;
  }
  .ico:hover { border-color: rgba(255,255,255,0.2); color: var(--text-1); }
  .ico svg { width: 20px; height: 20px; }
  .ico.att { color: var(--neg); border-color: rgba(224,101,92,0.55); background: rgba(224,101,92,0.12); }
  .ico:disabled { opacity: 0.35; cursor: default; }

  /* riga della strategia in vista */
  .strat { display: flex; align-items: center; gap: 6px; }
  .strat .snm {
    flex: 1; min-width: 0; text-align: left; background: none; border: none; padding: 0; cursor: pointer;
    font: inherit; color: var(--text-1); display: flex; flex-direction: column; gap: 1px;
  }
  .strat .snm small { font-size: 10px; color: var(--text-4); letter-spacing: 0.12em; }
  .strat .snm .mNome { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .strat .snm .mNome.vuota { color: var(--text-4); font-weight: 400; }
  .strat .snm:hover .mNome { color: var(--piano); }
  .strat .mini {
    height: 32px; padding: 0 10px; border-radius: 8px; cursor: pointer; font: inherit; font-size: 12px;
    border: 1px solid var(--edge); background: none; color: var(--text-4); flex: none;
  }
  .strat .mini:hover { color: var(--text-2); border-color: rgba(255,255,255,0.2); }
  .strat .mini.att { color: var(--neg); border-color: rgba(224,101,92,0.55); }
  .ico.piccolo { width: 32px; height: 32px; border-radius: 8px; }
  .ico.piccolo svg { width: 17px; height: 17px; }
  .totali .strat { margin-bottom: 10px; }
  .totali .strat + .sep { margin: 0 0 6px; }

  /* ——— tabella riepilogo ——— */
  /* orizzontale e minimale: reparti in colonna, tre righe (strategia, live, delta),
     una sola unità per volta scelta con l'interruttore cr / % */
  .tabella { flex: 0 1 auto; min-width: 0; padding: 12px var(--padT) 12px; display: flex; flex-direction: column; justify-content: center; }
  .tr {
    display: grid; align-items: center;
    grid-template-columns: 92px repeat(5, var(--cn));
    column-gap: var(--gc);
  }
  .tr .n { text-align: right; font-variant-numeric: tabular-nums; }
  .th { padding-bottom: 8px; border-bottom: 1px solid var(--edge); margin-bottom: 4px; }
  .th .rn { font-size: 13px; font-weight: 600; letter-spacing: 0.08em; }
  .th .rn.tot { color: var(--text-4); font-weight: 400; letter-spacing: 0.1em; }
  .tg {
    min-width: 38px; height: 26px; padding: 0 9px; border-radius: 7px; cursor: pointer;
    font: inherit; font-size: 12px; font-weight: 600; letter-spacing: 0.04em;
    color: var(--text-1); background: rgba(255,255,255,0.08); border: 1px solid var(--edge);
  }
  .tg:hover { border-color: rgba(255,255,255,0.22); }
  .tb .rl { font-size: 11px; font-weight: 600; letter-spacing: 0.12em; }
  .tb.p .rl { color: var(--piano); }
  .tb.l .rl { color: var(--live); }
  .tb.d .rl { color: var(--text-4); }
  .tb .n { font-size: 16px; padding: 7px 0; color: var(--text-1); font-weight: 500; }
  .tb .n.tot { font-weight: 500; }
  .tb.p .n.tot { color: var(--piano); }
  .tb.l .n.tot { color: var(--live); }
  .tb.d { border-top: 1px solid var(--edge); margin-top: 2px; }
  .tb .delta { color: var(--text-4); font-size: 15px; font-weight: 400; }
  .tb .delta.su { color: var(--neg); }
  .tb .delta.giu { color: var(--pos); }


  .sr-only {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0;
  }

  /* ——— barra mobile (nascosta su desktop) ——— */
  .mbar, .mnav { display: none; }

  /* ——— reparti ——— */
  .grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 24px; align-items: start; }
  @media (max-width: 1160px) { .grid { grid-template-columns: repeat(2, minmax(0,1fr)); } }

  .bhead { display: flex; align-items: baseline; gap: 9px; margin-bottom: 8px; }
  .rname { font-size: 15px; font-weight: 500; letter-spacing: 0.04em; }
  .slots { margin-left: auto; font-size: 12px; color: var(--text-4); }
  .slots b { color: var(--text-2); font-weight: 500; font-variant-numeric: tabular-nums; }

  /* box unico per reparto: etichetta slot | strategia (cr, %) | live (cr, %).
     La pipe è un segmento corto fra i due gruppi, dalle sotto-intestazioni ai totali. */
  .pbox {
    position: relative; min-width: 0; padding: 8px 8px 8px;
    border-radius: 10px; overflow: hidden;
    background: rgba(255,255,255,0.045); box-shadow: inset 0 0 0 1px var(--edge);
    --sl: 26px;   /* colonna etichetta slot */
    --gg: 6px;    /* gap fra le colonne */
  }
  .pbox::after {
    content: ''; position: absolute; width: 1px; top: 46px; bottom: 8px;
    left: calc(50% + (var(--sl) + var(--gg)) / 2);
    background: var(--hairline); pointer-events: none;
  }
  .phead, .pcols, .prow, .totrow {
    display: grid; grid-template-columns: var(--sl) minmax(0,1fr) minmax(0,1fr);
    column-gap: var(--gg); align-items: center;
  }
  .grp { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gg); min-width: 0; }

  .phead { margin-bottom: 8px; }
  .plab {
    display: flex; align-items: center; justify-content: center; height: 30px; border-radius: 7px;
    font-size: 12px; letter-spacing: 0.12em; font-weight: 600;
  }
  .plab.p { color: var(--piano); background: rgba(139,131,230,0.13); }
  .plab.l { color: var(--live);  background: rgba(53,177,164,0.13); }
  .pcols { margin-bottom: 7px; }
  .pcols .grp span {
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; color: var(--text-4); letter-spacing: 0.03em;
  }

  .sl { font-size: 12px; font-weight: 500; }
  .totrow .sl { color: var(--text-4); font-weight: 400; }

  .prow { margin-bottom: 7px; }
  .fw { position: relative; min-width: 0; }
  .ph {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    pointer-events: none; opacity: 0.16; transition: opacity .12s;
    font-size: 15px; color: var(--text-4); letter-spacing: 0.03em;
  }
  input.f:not(:placeholder-shown) ~ .ph { opacity: 0; }
  input.f {
    height: 36px; width: 100%; border: none; outline: none; border-radius: 8px;
    background: var(--field); color: var(--text-1);
    font: inherit; font-size: 16px; text-align: center; padding: 0 6px;
    font-variant-numeric: tabular-nums;
  }
  .grp.p input.f:focus { box-shadow: inset 0 0 0 1.5px var(--piano); }
  .grp.l input.f:focus { box-shadow: inset 0 0 0 1.5px var(--live); }

  .totrow { margin-top: 3px; padding-top: 10px; border-top: 1px solid var(--edge); }
  .totrow .grp span {
    height: 28px; display: flex; align-items: baseline; justify-content: center; gap: 4px;
    font-size: 16px; font-weight: 500; font-variant-numeric: tabular-nums;
  }
  .totrow .grp.p span { color: var(--piano); }
  .totrow .grp.l span { color: var(--live); }

  /* numero di slot per reparto, in Impostazioni */
  .slotcfg { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; padding: 8px 0 4px; }
  .slotcfg label { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; }
  .slotcfg input {
    width: 100%; height: 38px; border: none; outline: none; border-radius: 8px; text-align: center;
    background: var(--field); color: var(--text-1); font: inherit; font-size: 16px; font-weight: 500;
    box-shadow: inset 0 0 0 1px var(--edge); font-variant-numeric: tabular-nums;
  }
  .slotcfg input:focus { box-shadow: inset 0 0 0 1.5px var(--piano); }

  /* ——— pannello salvataggi ——— */
  .overlay {
    position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,0.72);
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .overlay[hidden] { display: none; }
  .sheet {
    width: 100%; max-width: 560px; max-height: 85vh; overflow: auto;
    background: #0f1115; border-radius: 14px; box-shadow: inset 0 0 0 1px var(--edge);
    padding: 16px 18px 18px;
  }
  .shead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 10px; }
  .shead .sbtn { display: flex; gap: 6px; flex: none; }
  .stit { font-size: 16px; font-weight: 500; letter-spacing: 0.02em; }
  /* sezioni e voci di menu dentro i pannelli */
  .sez { font-size: 11px; color: var(--text-4); letter-spacing: 0.14em; margin: 18px 0 6px; padding-bottom: 6px; border-bottom: 1px solid var(--edge); }
  .sez:first-of-type { margin-top: 4px; }
  .sez.rischio { color: var(--neg); border-bottom-color: rgba(224,101,92,0.35); }
  .voce {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; margin: 0 0 6px;
    padding: 10px 12px; border-radius: 10px; cursor: pointer; font: inherit; color: var(--text-1);
    background: rgba(255,255,255,0.045); border: 1px solid var(--edge);
  }
  .voce:hover { border-color: rgba(255,255,255,0.2); }
  .voce .vt { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
  .voce b { font-size: 14px; font-weight: 500; }
  .voce b em { font-style: normal; color: var(--text-4); font-weight: 400; margin-left: 6px; font-variant-numeric: tabular-nums; }
  .voce small { font-size: 12px; color: var(--text-4); line-height: 1.35; }
  .voce i { font-style: normal; color: var(--text-4); font-size: 18px; flex: none; }
  .voce.primaria { border-color: rgba(139,131,230,0.5); background: rgba(139,131,230,0.12); }
  .voce.primaria b { color: var(--piano); }
  .voce.ok small { color: var(--live); }
  .btn.rosso { color: var(--neg); border-color: rgba(224,101,92,0.4); }
  .sheet .riga .btn { margin-left: auto; }
  .sbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .sheet .riga { padding: 10px 0; }
  .sheet .sep { margin: 6px 0 4px; }
  .nota { font-size: 12px; color: var(--text-4); margin: 0 0 8px; line-height: 1.45; }
  .vuoto { font-size: 13px; color: var(--text-4); margin: 18px 0 8px; text-align: center; }
  .btn {
    height: 32px; padding: 0 12px; border-radius: 8px; cursor: pointer; font: inherit; font-size: 13px;
    color: var(--text-1); background: rgba(255,255,255,0.06); border: 1px solid var(--edge);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn:hover { border-color: rgba(255,255,255,0.2); }
  .btn.ghost { background: none; color: var(--text-4); }
  .btn.ghost:hover { color: var(--text-2); }
  .btn.att { color: var(--neg); border-color: rgba(224,101,92,0.5); }
  .btn.ok  { color: var(--live); border-color: rgba(53,177,164,0.5); }
  .snap {
    display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 4px 10px; align-items: center;
    padding: 10px 0; border-top: 1px solid var(--edge);
  }
  .snap:first-of-type { border-top: none; }
  .snome {
    grid-column: 1; min-width: 0; height: 30px; padding: 0 8px; margin-left: -8px; border-radius: 7px;
    border: none; outline: none; background: none; color: var(--text-1); font: inherit; font-size: 14px; font-weight: 500;
  }
  .snome:hover { background: rgba(255,255,255,0.04); }
  .snome:focus { background: var(--field); box-shadow: inset 0 0 0 1.5px var(--piano); }
  .smeta { grid-column: 1; font-size: 12px; color: var(--text-4); font-variant-numeric: tabular-nums; }
  .smeta.err { color: var(--neg); }
  .sazioni { grid-column: 2; grid-row: 1 / span 2; display: flex; gap: 6px; }
  .snap.corrente .stit { font-size: 14px; }
  .snap.corrente .stit i { font-style: normal; font-size: 11px; color: var(--live); margin-left: 8px; letter-spacing: 0.08em; }

  /* ——— pannello GitHub ——— */
  .passi { font-size: 12px; color: var(--text-3); padding-left: 18px; margin: 0 0 14px; line-height: 1.55; }
  .passi a { color: var(--piano); text-decoration: none; }
  .passi a:hover { text-decoration: underline; }
  .campo { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; font-size: 11px; color: var(--text-4); letter-spacing: 0.1em; }
  .campo input {
    height: 38px; border-radius: 8px; border: none; outline: none; padding: 0 10px;
    background: var(--field); color: var(--text-1); font: inherit; font-size: 14px; letter-spacing: 0;
    box-shadow: inset 0 0 0 1px var(--edge);
  }
  .campo input:focus { box-shadow: inset 0 0 0 1.5px var(--piano); }
  .stato-gh { font-size: 12px; margin: 6px 0 0; }
  .stato-gh.ok { color: var(--live); }
  .stato-gh.err { color: var(--neg); }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 60;
    padding: 9px 14px; border-radius: 9px; font-size: 13px; color: var(--text-1);
    background: #1a1e24; box-shadow: 0 8px 24px rgba(0,0,0,0.6), inset 0 0 0 1px var(--edge);
    white-space: nowrap; max-width: calc(100vw - 32px); overflow: hidden; text-overflow: ellipsis;
  }
  .toast[hidden] { display: none; }
  .toast.alto { bottom: auto; top: calc(14px + env(safe-area-inset-top)); }
  .toast .tazione {
    margin-left: 12px; padding: 4px 10px; border-radius: 6px; cursor: pointer; font: inherit; font-size: 12px; font-weight: 600;
    color: var(--piano); background: rgba(139,131,230,0.14); border: 1px solid rgba(139,131,230,0.45);
  }

  /* ——— telefono ——— */
  @media (max-width: 720px) {
    :root { --padT: 12px; }
    body { padding: 0 12px calc(40px + env(safe-area-inset-bottom)); }
    .wrap { display: flex; flex-direction: column; }
    /* lo sticky va sul contenitore diretto di .wrap, altrimenti resta chiuso in un div alto quanto la barra */
    #mbar { order: -1; position: sticky; top: 0; z-index: 20; }
    .summaries { flex-direction: column; gap: 12px; margin-bottom: 12px; }
    /* la card totali esce dal flusso: vive nell'intestazione fissa */
    .summaries .totali { display: none; }
    .residuo .v { font-size: 36px; }

    .tr { grid-template-columns: 62px repeat(5, minmax(0,1fr)); column-gap: 5px; }
    .th .rn { font-size: 12px; letter-spacing: 0.06em; }
    .tb .rl { font-size: 10px; letter-spacing: 0.08em; }
    .tb .n { font-size: 14px; padding: 6px 0; }
    .tb .delta { font-size: 13px; }

    .mbar {
      display: block;
      margin: 0 -12px 12px; padding: calc(8px + env(safe-area-inset-top)) 12px 10px;
      background: rgba(0,0,0,0.92);
      -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--edge);
    }
    .mbar .strat { margin-bottom: 8px; }
    .mtop { display: flex; align-items: center; gap: 16px; }
    .mval.sl { align-items: flex-end; }
    .mval.sl b { font-size: 16px; color: var(--text-2); }
    .mico { align-items: center; gap: 10px; }
    .mval { display: flex; flex-direction: column; gap: 1px; }
    .mval .k { font-size: 10px; }
    .mval b { font-size: 24px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
    .mval b.neg { color: var(--neg); }
    .mval .cr { font-size: 11px; color: var(--text-4); font-weight: 400; margin-left: 3px; }
    .mval.mx b { font-size: 18px; color: var(--text-2); }
    .mico { margin-left: auto; display: flex; gap: 6px; }
    .mnav { display: flex; gap: 6px; margin-bottom: 10px; }
    .bhead { display: none; }
    .mtab {
      flex: 1; height: 44px; border-radius: 9px; cursor: pointer; font: inherit;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
      font-size: 12px; font-weight: 600; letter-spacing: 0.1em;
      background: none; border: 1px solid var(--edge); color: var(--text-4);
    }
    .mtab small { font-size: 11px; font-weight: 400; letter-spacing: 0; color: var(--text-4); font-variant-numeric: tabular-nums; }
    .mtab.on { color: var(--hex); border-color: var(--hex); background: color-mix(in srgb, var(--hex) 14%, transparent); }
    .mtab.on small { color: var(--text-2); }

    .grid { grid-template-columns: 1fr; gap: 16px; }
    .block:not(.on) { display: none; }
    .rname { font-size: 16px; }

    .overlay { align-items: flex-end; padding: 0; }
    .sheet { max-height: 88vh; border-radius: 16px 16px 0 0; padding-bottom: calc(18px + env(safe-area-inset-bottom)); }
    .btn { height: 36px; }
    .snap { grid-template-columns: minmax(0,1fr); }
    .sazioni { grid-column: 1; grid-row: auto; justify-content: flex-end; margin-top: 4px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="summaries" id="sums"></div>
  <div id="mbar"></div>
  <div id="mnav"></div>
  <div class="grid" id="grid"></div>
</div>
<div class="overlay" id="overlay" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
const CHIAVE = 'asta.v1';        // copia di lavoro, salvata in automatico
const CHIAVE_SNAP = 'asta.snap.v1'; // salvataggi con nome e data
const CR = '<span class="cr">cr</span>';

/* ——— stato: i crediti del singolo slot sono la fonte di verità ——— */
const nuovi = n => Array.from({length: n}, () => ({ p: null, l: null }));
const iniziale = () => ({
  budget: 500,
  ruoli: [
    { nome:'POR', ini:'P', hex:'#e0a54a', slot: nuovi(3) },
    { nome:'DIF', ini:'D', hex:'#5cba85', slot: nuovi(8) },
    { nome:'CEN', ini:'C', hex:'#6b9ee0', slot: nuovi(8) },
    { nome:'ATT', ini:'A', hex:'#e0655c', slot: nuovi(6) },
  ]
});

/* ——— numeri ——— */
const num = v => {
  if (v === null || v === undefined) return null;
  const s = String(v).replace('%','').replace(',','.').trim();
  if (s === '') return null;
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
};
const cr = v => v === null ? '' : (Math.round(v * 10) / 10).toString().replace('.', ',');
/* intero se non serve il decimale, altrimenti un decimale con la virgola */
const pcFmt = v => {
  if (v === null) return '';
  const r = Math.round(v * 10) / 10;
  return (Number.isInteger(r) ? String(r) : r.toFixed(1).replace('.', ',')) + '%';
};
const somma = (r, k) => r.slot.reduce((a, s) => a + (s[k] ?? 0), 0);
const pieni = (r, k) => r.slot.filter(s => s[k] !== null).length;
const quota = v => stato.budget > 0 ? (v / stato.budget) * 100 : 0;
const esc = s => String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const clona = o => JSON.parse(JSON.stringify(o));

/* Rende sicuro uno stato letto da fuori (localStorage o file importato):
   tiene solo i campi che conosciamo e forza i numeri. Torna null se non è uno stato. */
function pulisci(s) {
  if (!s || !Array.isArray(s.ruoli) || s.ruoli.length === 0) return null;
  const base = iniziale();
  return {
    budget: num(s.budget) ?? 0,
    ruoli: s.ruoli.map((r, i) => ({
      nome: String(r.nome ?? base.ruoli[i]?.nome ?? '?').slice(0, 6),
      ini:  String(r.ini ?? (r.nome ?? '?')[0]).slice(0, 2),
      hex:  /^#[0-9a-f]{6}$/i.test(r.hex) ? r.hex : (base.ruoli[i]?.hex ?? '#888888'),
      slot: (Array.isArray(r.slot) && r.slot.length ? r.slot : nuovi(1)).map(x => ({ p: num(x?.p), l: num(x?.l) })),
    })),
  };
}

let stato = iniziale();
try {
  const salvato = pulisci(JSON.parse(localStorage.getItem(CHIAVE)));
  if (salvato) stato = salvato;
} catch (e) { /* si riparte da zero */ }

/* salvataggi locali (localStorage). Con GitHub collegato la lista attiva è quella remota, vedi più sotto. */
let snapLocali = [];
try {
  const voci = JSON.parse(localStorage.getItem(CHIAVE_SNAP) || '[]');
  if (Array.isArray(voci)) snapLocali = voci.map(x => ({
    id: String(x.id), nome: String(x.nome ?? ''), data: String(x.data ?? ''), stato: pulisci(x.stato)
  })).filter(x => x.stato);
} catch (e) { snapLocali = []; }

function salvaSubito() {
  try { localStorage.setItem(CHIAVE, JSON.stringify(stato)); } catch (e) { /* modalità privata */ }
}
let timerSalva;
function salva() {
  clearTimeout(timerSalva);
  timerSalva = setTimeout(salvaSubito, 350);
}
function salvaSnap() {
  try { localStorage.setItem(CHIAVE_SNAP, JSON.stringify(snapLocali)); } catch (e) { avviso('Spazio pieno: salvataggio non riuscito'); }
}

const $sums = document.getElementById('sums');
const $mbar = document.getElementById('mbar');
const $mnav = document.getElementById('mnav');
const $grid = document.getElementById('grid');
const $overlay = document.getElementById('overlay');
const $toast = document.getElementById('toast');
const set = (sel, txt) => { const el = document.querySelector(sel); if (el) el.textContent = txt; };
const setAll = (sel, txt) => document.querySelectorAll(sel).forEach(el => { el.textContent = txt; });

let timerToast, azioneToast = null;
/* avviso in basso; con etichetta e funzione mostra anche un pulsante (per esempio Annulla) */
function avviso(testo, etichetta, fn) {
  $toast.textContent = testo;
  azioneToast = null;
  if (etichetta && fn) {
    const b = document.createElement('button');
    b.textContent = etichetta; b.className = 'tazione';
    azioneToast = fn;
    $toast.appendChild(b);
  }
  $toast.classList.toggle('alto', !$overlay.hidden);   // con un pannello aperto l'avviso sale, così non copre i pulsanti
  $toast.hidden = false;
  clearTimeout(timerToast);
  timerToast = setTimeout(() => { $toast.hidden = true; azioneToast = null; }, etichetta ? 6000 : 2200);
}
$toast.addEventListener('click', e => {
  if (e.target.classList.contains('tazione') && azioneToast) {
    const fn = azioneToast; azioneToast = null; $toast.hidden = true; clearTimeout(timerToast); fn();
  }
});

/* ——— render ——— */
/* riga con il nome della strategia in vista e le sue azioni: azzera, cestina, impostazioni */
function rigaStrategia() {
  return `<div class="strat">
    <button class="snm" data-apri="salvataggi" title="Apri le strategie"><small>STRATEGIA</small><span class="mNome">…</span></button>
    <button class="mini" data-az="azzera" title="Svuota tutti gli slot e riporta il budget a 500">Azzera</button>
    <button class="ico piccolo" data-az="cestina" aria-label="Elimina questa strategia" title="Elimina questa strategia">${ICO.cestino}</button>
    <button class="ico piccolo" data-apri="impostazioni" aria-label="Impostazioni" title="Impostazioni">${ICO.impostazioni}</button>
  </div>`;
}

function colonnaTotali() {
  return `<div class="card totali">
    ${rigaStrategia()}
    <div class="sep"></div>
    <div class="residuo rtop">
      <div>
        <span class="k">RESIDUO</span>
        <span class="v"><b id="residuo">0</b>${CR}</span>
      </div>
      <div class="max">
        <span class="k">OFFERTA MAX</span>
        <span class="mv"><b id="offMax">0</b>${CR}</span>
      </div>
    </div>
    <div class="sep"></div>
    <div class="riga">
      <span class="rk">BUDGET</span>
      <input class="budget" inputmode="decimal" aria-label="Budget" value="${cr(stato.budget)}">
    </div>
    <div class="riga">
      <span class="rk">SLOT</span>
      <span class="rv slotTot">0 / 25</span>
    </div>
    <div class="track"><i id="trackTot" style="width:0%;background:var(--live)"></i></div>
    <div class="azioni">
      <button class="az primaria" data-az="salva">Salva strategia</button>
      <button class="az" data-apri="salvataggi">Strategie<b class="nSnap">${lista().length}</b></button>
    </div>
  </div>`;
}

/* intestazione comune dei pannelli: titolo, Indietro se c'è una pila, Chiudi */
function testa(titolo, chiudi = 'Chiudi') {
  return `<div class="shead">
    <span class="stit">${titolo}</span>
    <span class="sbtn">
      ${pila.length ? '<button class="btn ghost" data-az="indietro">Indietro</button>' : ''}
      <button class="btn ghost" data-chiudi>${chiudi}</button>
    </span>
  </div>`;
}

function pannelloImpostazioni() {
  let dati = '';
  if (remoto()) {
    dati += `<button class="voce ok" data-apri="github">
      <span class="vt"><b>GitHub</b><small>Collegato a ${esc(gh.repo)}. Le strategie sono file nel repo, uguali su tutti i tuoi dispositivi.</small></span><i>›</i>
    </button>
    <div class="riga">
      <span class="rk">STATO ATTUALE</span>
      <button class="btn" data-az="sincronizza">Invia a GitHub</button>
    </div>`;
    if (correnteRemoto) dati += `<div class="riga">
      <span class="rk" style="letter-spacing:0;font-size:13px">Sincronizzato il ${dataIt(correnteRemoto.data)}<br><span class="smeta">${riassunto(correnteRemoto.stato)}</span></span>
      <button class="btn" data-carica="corrente">Carica</button>
    </div>`;
  } else {
    dati += `<button class="voce" data-apri="github">
      <span class="vt"><b>GitHub</b><small>Non collegato. Le strategie restano nel browser di questo dispositivo.</small></span><i>›</i>
    </button>`;
  }

  return `<div class="sheet" role="dialog" aria-label="Impostazioni">
    ${testa('Impostazioni')}

    <div class="sez">ASTA</div>
    <div class="riga">
      <span class="rk">BUDGET</span>
      <input class="budget" inputmode="decimal" aria-label="Budget" value="${cr(stato.budget)}">
    </div>
    <div class="riga" style="padding-bottom:0"><span class="rk">GIOCATORI PER REPARTO</span></div>
    <div class="slotcfg">${stato.ruoli.map((r, i) => `
      <label style="color:${r.hex}">${r.ini}<input class="nslot" data-r="${i}" inputmode="numeric" pattern="[0-9]*" aria-label="Slot ${r.nome}" value="${r.slot.length}"></label>`).join('')}
    </div>

    <div class="sez">STRATEGIE</div>
    <button class="voce primaria" data-az="salva">
      <span class="vt"><b>Salva la situazione attuale</b><small>Crea una strategia con nome da strategia e live di adesso.</small></span>
    </button>
    <button class="voce" data-apri="salvataggi">
      <span class="vt"><b>Le mie strategie<em class="nSnap">${lista().length}</em></b><small>Carica, rinomina, aggiorna o elimina.</small></span><i>›</i>
    </button>

    <div class="sez">DATI</div>
    ${dati}
    <div class="sbar" style="margin-top:8px">
      <button class="btn" id="esporta">Esporta backup</button>
      <label class="btn" for="importa">Importa backup</label>
      <input type="file" id="importa" accept="application/json,.json" hidden>
    </div>
  </div>`;
}

const ICO = {
  cestino: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>',
  impostazioni: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
};

/* unità mostrata nella tabella riepilogo: 'cr' oppure 'pc' (percentuale del budget) */
let unita = 'cr';
try { if (localStorage.getItem('asta.unita') === 'pc') unita = 'pc'; } catch (e) { /* niente */ }

function tabella() {
  const teste = stato.ruoli.map(r => `<span class="n rn" style="color:${r.hex}">${r.nome}</span>`).join('');
  const celle = k => stato.ruoli.map((_, i) => `<span class="n" data-cell="${k}-${i}">0</span>`).join('')
    + `<span class="n tot" data-cell="${k}-tot">0</span>`;
  const delte = stato.ruoli.map((_, i) => `<span class="n delta" data-delta="${i}">-</span>`).join('')
    + `<span class="n delta" data-delta="tot">-</span>`;

  return `<div class="card tabella">
    <div class="tr th">
      <span><button class="tg" data-unita aria-label="Cambia unità fra crediti e percentuale">${unita === 'cr' ? 'cr' : '%'}</button></span>
      ${teste}
      <span class="n rn tot">TOT</span>
    </div>
    <div class="tr tb p"><span class="rl">STRATEGIA</span>${celle('p')}</div>
    <div class="tr tb l"><span class="rl">LIVE</span>${celle('l')}</div>
    <div class="tr tb d"><span class="rl">DELTA<span class="sr-only">: live meno strategia</span></span>${delte}</div>
  </div>`;
}

/* un valore in crediti reso nell'unità scelta per la tabella */
const inUnita = v => unita === 'cr' ? (cr(v) || '0') : pcFmt(quota(v));

let reparto = 0;                                   // reparto visibile sul telefono

/* barra fissa in alto sul telefono: residuo, offerta max e schede dei reparti */
function barraMobile() {
  return `<div class="mbar">
    ${rigaStrategia()}
    <div class="mtop">
      <div class="mval"><span class="k">RESIDUO</span><b id="mRes">0<span class="cr">cr</span></b></div>
      <div class="mval mx"><span class="k">OFFERTA MAX</span><b id="mMax">0<span class="cr">cr</span></b></div>
      <div class="mico">
        <div class="mval sl"><span class="k">SLOT</span><b class="slotTot">0 / 25</b></div>
      </div>
    </div>
  </div>`;
}

/* schede dei reparti sul telefono, appena sopra il box del reparto scelto */
function navMobile() {
  return `<div class="mnav">${stato.ruoli.map((r, i) => `
    <button class="mtab ${i === reparto ? 'on' : ''}" data-reparto="${i}" style="--hex:${r.hex}">
      ${r.nome}<small data-mslot="${i}">0/${r.slot.length}</small>
    </button>`).join('')}
  </div>`;
}

/* una coppia di campi (cr, %) di uno slot, per la strategia o per la live */
function gruppo(ri, si, campo) {
  const v = stato.ruoli[ri].slot[si][campo];
  return `<div class="grp ${campo}">
    <span class="fw">
      <input class="f" placeholder=" " inputmode="decimal" data-r="${ri}" data-s="${si}" data-k="${campo}" data-t="cr" value="${cr(v)}">
      <span class="ph">cr</span>
    </span>
    <span class="fw">
      <input class="f" placeholder=" " inputmode="decimal" data-r="${ri}" data-s="${si}" data-k="${campo}" data-t="pc" value="${v === null ? '' : pcFmt(quota(v))}">
      <span class="ph">%</span>
    </span>
  </div>`;
}

function blocco(ri) {
  const r = stato.ruoli[ri];
  const righe = r.slot.map((_, si) => `
    <div class="prow">
      <span class="sl" style="color:${r.hex}">${r.ini}${si + 1}</span>
      ${gruppo(ri, si, 'p')}
      ${gruppo(ri, si, 'l')}
    </div>`).join('');
  const tot = k => `<div class="grp ${k}">
      <span><b data-rtot-cr="${k}-${ri}">0</b>${CR}</span>
      <span data-rtot-pc="${k}-${ri}">0%</span>
    </div>`;

  return `<div class="block ${ri === reparto ? 'on' : ''}" data-ri="${ri}">
    <div class="bhead">
      <span class="rname" style="color:${r.hex}">${r.nome}</span>
      <span class="slots"><b data-slots="${ri}">0/${r.slot.length}</b> slot</span>
    </div>
    <div class="track"><i data-track="${ri}" style="width:0%;background:${r.hex}"></i></div>
    <div class="pbox">
      <div class="phead"><span></span><span class="plab p">STRATEGIA</span><span class="plab l">LIVE</span></div>
      <div class="pcols">
        <span></span>
        <div class="grp"><span>cr</span><span>%</span></div>
        <div class="grp"><span>cr</span><span>%</span></div>
      </div>
      ${righe}
      <div class="totrow">
        <span class="sl">tot</span>
        ${tot('p')}${tot('l')}
      </div>
    </div>
  </div>`;
}

function disegna() {
  if (reparto >= stato.ruoli.length) reparto = 0;
  $sums.innerHTML = colonnaTotali() + tabella();
  $mbar.innerHTML = barraMobile();
  $mnav.innerHTML = navMobile();
  $grid.innerHTML = stato.ruoli.map((_, i) => blocco(i)).join('');
  aggiorna();
}

/* ——— calcolo ——— */
function scriviDelta(chiave, d, mostra) {
  const el = document.querySelector(`[data-delta="${chiave}"]`);
  if (!el) return;
  el.textContent = mostra ? (d > 0 ? '+' : '') + inUnita(d) : '-';
  el.classList.toggle('su',  mostra && d > 0);
  el.classList.toggle('giu', mostra && d < 0);
}

function aggiorna(escludi) {
  let totP = 0, totL = 0, slotPieni = 0, slotTot = 0, usati = 0;
  stato.ruoli.forEach((r, ri) => {
    for (const k of ['p','l']) {
      const s = somma(r, k);
      if (k === 'p') totP += s; else totL += s;
      usati += pieni(r, k);
      set(`[data-rtot-cr="${k}-${ri}"]`, cr(s) || '0');
      set(`[data-rtot-pc="${k}-${ri}"]`, pcFmt(quota(s)));
      set(`[data-cell="${k}-${ri}"]`, inUnita(s));
    }
    scriviDelta(ri, somma(r,'l') - somma(r,'p'), pieni(r,'p') + pieni(r,'l') > 0);

    const pn = pieni(r, 'l');
    slotPieni += pn; slotTot += r.slot.length;
    set(`[data-slots="${ri}"]`, `${pn}/${r.slot.length}`);
    set(`[data-mslot="${ri}"]`, `${pn}/${r.slot.length}`);
    const bar = document.querySelector(`[data-track="${ri}"]`);
    if (bar) bar.style.width = Math.round((pn / r.slot.length) * 100) + '%';
  });

  set('[data-cell="p-tot"]', inUnita(totP));
  set('[data-cell="l-tot"]', inUnita(totL));
  scriviDelta('tot', totL - totP, usati > 0);

  setAll('.slotTot', `${slotPieni} / ${slotTot}`);
  scriviAttuale();
  document.querySelectorAll('input.budget').forEach(i => { if (i !== escludi) i.value = cr(stato.budget); });
  const barTot = document.getElementById('trackTot');
  if (barTot) barTot.style.width = (slotTot ? Math.round((slotPieni / slotTot) * 100) : 0) + '%';

  const res = stato.budget - totL;                 // la live comanda il residuo

  /* Offerta max: guarda solo la live. Quanto posso mettere su UN giocatore
     tenendo 1 credito per ognuno degli ALTRI slot live ancora vuoti.
     Se non resta nessuno slot vuoto non devo coprire piu' niente: e' tutto il residuo.
     La strategia non entra nel calcolo. */
  const vuoti = slotTot - slotPieni;
  const offMax = cr(Math.max(0, Math.floor(res - Math.max(0, vuoti - 1)))) || '0';
  set('#offMax', offMax);
  const $r = document.getElementById('residuo');
  if ($r) {
    $r.textContent = cr(res) || '0';
    $r.closest('.v').classList.toggle('neg', res < 0);
  }
  const $mr = document.getElementById('mRes'), $mm = document.getElementById('mMax');
  if ($mr) { $mr.firstChild.textContent = cr(res) || '0'; $mr.classList.toggle('neg', res < 0); }
  if ($mm) $mm.firstChild.textContent = offMax;

  document.querySelectorAll('input.f').forEach(el => {
    if (el === escludi) return;
    const v = stato.ruoli[+el.dataset.r].slot[+el.dataset.s][el.dataset.k];
    el.value = el.dataset.t === 'cr' ? cr(v) : (v === null ? '' : pcFmt(quota(v)));
  });
}

/* ——— GitHub come archivio ———
   Con repo e token impostati, ogni salvataggio è un file salvataggi/<id>.json nel repo
   e lo stato corrente si può inviare come corrente.json. Il token resta nel browser. */
const CHIAVE_GH = 'asta.gh';
let gh = { repo: '', token: '' };
try {
  const c = JSON.parse(localStorage.getItem(CHIAVE_GH) || '{}');
  gh = { repo: String(c.repo || ''), token: String(c.token || '') };
} catch (e) { /* non collegato */ }
const remoto = () => !!(gh.repo && gh.token);
function salvaGh() { try { localStorage.setItem(CHIAVE_GH, JSON.stringify(gh)); } catch (e) { /* niente */ } }

let snapRemoti = [];        // { id, nome, data, stato, sha }
let correnteRemoto = null;  // { data, stato, sha }
const statoGh = { caricamento: false, errore: '', aggiornato: null };
const lista = () => remoto() ? snapRemoti : snapLocali;
const perData = (a, b) => b.data.localeCompare(a.data);

const b64 = s => { const b = new TextEncoder().encode(s); let bin = ''; for (const x of b) bin += String.fromCharCode(x); return btoa(bin); };
const deb64 = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g, '')), c => c.charCodeAt(0)));

function spiegaErrore(s) {
  if (s === 401) return 'Token non valido o scaduto';
  if (s === 403) return 'Il token non può scrivere su questo repo';
  if (s === 404) return 'Repo non trovato: controlla il nome';
  if (s === 409 || s === 422) return 'Il file è cambiato altrove, lista ricaricata';
  return `Errore GitHub (${s})`;
}

/* una chiamata all'API. GET su qualcosa che non esiste torna null invece di lanciare. */
async function ghReq(metodo, percorso, corpo, grezzo) {
  const url = `https://api.github.com/repos/${gh.repo}${percorso ? '/' + percorso : ''}`;
  let r;
  try {
    r = await fetch(url, {
      method: metodo, cache: 'no-store',
      headers: {
        Authorization: `Bearer ${gh.token}`,
        Accept: grezzo ? 'application/vnd.github.raw+json' : 'application/vnd.github+json',
        'X-GitHub-Api-Version': '2022-11-28',
        ...(corpo ? { 'Content-Type': 'application/json' } : {}),
      },
      body: corpo ? JSON.stringify(corpo) : undefined,
    });
  } catch (e) { const err = new Error('Rete non disponibile'); err.status = 0; throw err; }
  if (r.status === 404 && metodo === 'GET') return null;
  if (!r.ok) { const err = new Error(spiegaErrore(r.status)); err.status = r.status; throw err; }
  return grezzo ? r.text() : r.json();
}
async function ghScrivi(percorso, oggetto, sha, messaggio) {
  const r = await ghReq('PUT', `contents/${percorso}`, {
    message: messaggio, content: b64(JSON.stringify(oggetto, null, 2)), ...(sha ? { sha } : {}),
  });
  return r.content.sha;
}
async function ghCancella(percorso, sha, messaggio) {
  await ghReq('DELETE', `contents/${percorso}`, { message: messaggio, sha });
}

/* esegue un'operazione remota; in caso di errore avvisa e, se il file è cambiato altrove, ricarica */
async function operazione(fn) {
  try { await fn(); return true; }
  catch (e) {
    avviso(e.message);
    if (e.status === 409 || e.status === 422) ricaricaRemoto();
    return false;
  }
}

async function ricaricaRemoto() {
  if (!remoto() || statoGh.caricamento) return;
  statoGh.caricamento = true; statoGh.errore = '';
  rinfrescaSeLibero();
  try {
    const voci = (await ghReq('GET', 'contents/salvataggi')) || [];
    const file = (Array.isArray(voci) ? voci : []).filter(v => v.type === 'file' && /\.json$/i.test(v.name));
    const letti = await Promise.all(file.map(async v => {
      try {
        const d = JSON.parse(await ghReq('GET', `contents/salvataggi/${encodeURIComponent(v.name)}`, null, true));
        const st = pulisci(d.stato);
        return st ? { id: v.name.replace(/\.json$/i, ''), nome: String(d.nome ?? ''), data: String(d.data ?? ''), stato: st, sha: v.sha } : null;
      } catch (e) { return null; }
    }));
    snapRemoti = letti.filter(Boolean).sort(perData);

    const meta = await ghReq('GET', 'contents/corrente.json');
    correnteRemoto = null;
    if (meta && meta.content) {
      try {
        const d = JSON.parse(deb64(meta.content));
        const st = pulisci(d.stato);
        if (st) correnteRemoto = { data: String(d.data ?? ''), stato: st, sha: meta.sha };
      } catch (e) { /* file corrotto: lo ignoro */ }
    }
    statoGh.aggiornato = new Date();
  } catch (e) { statoGh.errore = e.message; }
  statoGh.caricamento = false;
  setAll('.nSnap', lista().length);
  rinfrescaSeLibero();
}

/* ——— salvataggi (locali o remoti, stessa interfaccia) ——— */
const nuovoId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const dataIt = iso => {
  const d = new Date(iso);
  return isNaN(d) ? '' : d.toLocaleString('it-IT', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' });
};
const oraIt = d => d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
function riassunto(s) {
  const live = s.ruoli.reduce((a, r) => a + somma(r, 'l'), 0);
  const pn = s.ruoli.reduce((a, r) => a + pieni(r, 'l'), 0);
  const tot = s.ruoli.reduce((a, r) => a + r.slot.length, 0);
  return `${cr(live) || '0'} cr live · ${pn}/${tot} slot · budget ${cr(s.budget) || '0'}`;
}
const fileSnap = s => ({ id: s.id, nome: s.nome, data: s.data, stato: s.stato });

async function aggiungiSnap(s) {
  let ok = true;
  if (remoto()) {
    ok = await operazione(async () => {
      const sha = await ghScrivi(`salvataggi/${s.id}.json`, fileSnap(s), null, `Salvataggio: ${s.nome || s.id}`);
      snapRemoti.push({ ...s, sha }); snapRemoti.sort(perData);
    });
  } else { snapLocali.push(s); snapLocali.sort(perData); salvaSnap(); }
  setAll('.nSnap', lista().length);
  return ok;
}
/* crea una strategia nuova; torna l'oggetto creato oppure null se la scrittura è fallita */
async function creaSnap(nome, st) {
  const s = { id: nuovoId(), nome, data: new Date().toISOString(), stato: clona(st) };
  return (await aggiungiSnap(s)) ? s : null;
}
async function aggiornaSnap(s, campi, messaggio) {
  Object.assign(s, campi);
  if (attuale && attuale.id === s.id) { attuale.nome = s.nome; impostaAttuale(s); }
  if (remoto()) {
    return operazione(async () => { s.sha = await ghScrivi(`salvataggi/${s.id}.json`, fileSnap(s), s.sha, messaggio || `Aggiornato: ${s.nome || s.id}`); });
  }
  salvaSnap(); return true;
}
async function eliminaSnap(s) {
  let ok = true;
  if (remoto()) {
    ok = await operazione(async () => {
      await ghCancella(`salvataggi/${s.id}.json`, s.sha, `Eliminato: ${s.nome || s.id}`);
      snapRemoti = snapRemoti.filter(x => x !== s);
    });
  } else { snapLocali = snapLocali.filter(x => x !== s); salvaSnap(); }
  if (ok && attuale && attuale.id === s.id) impostaAttuale(null);
  setAll('.nSnap', lista().length);
  return ok;
}
async function sincronizzaCorrente() {
  return operazione(async () => {
    const data = new Date().toISOString();
    const sha = await ghScrivi('corrente.json', { data, stato }, correnteRemoto?.sha, 'Stato corrente sincronizzato');
    correnteRemoto = { data, stato: clona(stato), sha };
    avviso('Stato corrente inviato a GitHub');
  });
}
/* porta su GitHub i salvataggi rimasti nel browser, poi li toglie dal locale */
async function migraLocali() {
  const daFare = snapLocali.filter(s => !snapRemoti.some(x => x.id === s.id));
  let n = 0;
  for (const s of daFare) { if (await aggiungiSnap(s)) n++; else break; }
  if (n === daFare.length) { snapLocali = []; salvaSnap(); avviso(n === 1 ? '1 salvataggio portato su GitHub' : `${n} salvataggi portati su GitHub`); }
  else avviso(`Portati ${n} su ${daFare.length}: riprova per gli altri`);
}

/* ——— pannelli: pila per Indietro, apertura per nome, rinfresco ——— */
let pannelloAperto = null;
let pila = [];

function rigaSnap(s) {
  return `<div class="snap" data-id="${s.id}">
    <input class="snome" value="${esc(s.nome)}" data-rinomina="${s.id}" aria-label="Nome della strategia" placeholder="Senza nome" autocomplete="off">

    <div class="sazioni">
      <button class="btn" data-carica="${s.id}">Carica</button>
      <button class="btn ghost" data-sovrascrivi="${s.id}" title="Sostituisce questa strategia con la situazione attuale">Aggiorna</button>

    </div>
  </div>`;
}

function pannelloSnap() {

function pannelloSalva() {
  return `<div class="sheet" role="dialog" aria-label="Salva strategia">
    ${testa('Salva strategia', 'Annulla')}
    <label class="campo">NOME<input id="nomeSnap" value="" placeholder="Strategia ${lista().length + 1}" autocomplete="off" enterkeyhint="done"></label>
    <p class="nota">Salva strategia e live di tutti i reparti così come sono adesso${remoto() ? ', come file nel repo GitHub' : ''}. Il nome si può cambiare anche dopo, dalla lista.</p>

function pannelloGitHub() {
  return `<div class="sheet" role="dialog" aria-label="Collegamento a GitHub">
    ${testa('GitHub')}
    <p class="nota">Con GitHub collegato ogni salvataggio diventa un file JSON nella cartella <b>salvataggi</b> del repo, uguale su PC e telefono, con tutta la storia delle versioni. Il token resta solo in questo browser: va incollato una volta per dispositivo.</p>
    <ol class="passi">
      <li><a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">Crea un token</a> di tipo fine-grained: in "Repository access" scegli solo il repo qui sotto, in "Permissions" dai a <b>Contents</b> il livello <b>Read and write</b>.</li>
      <li>Incolla il token qui sotto e premi Collega.</li>
    </ol>
    <label class="campo">REPO<input id="ghRepo" value="${esc(gh.repo || 'AlessiMarco/FantaManager')}" placeholder="utente/repo" autocapitalize="off" autocomplete="off" spellcheck="false"></label>
    <label class="campo">TOKEN<input id="ghToken" type="password" value="${esc(gh.token)}" placeholder="github_pat_…" autocomplete="off"></label>
    <div class="sbar">

      ${remoto() ? '<button class="btn ghost" data-az="ghScollega">Scollega</button>' : ''}
    </div>

async function collegaGh(repo, token) {
  const $s = document.getElementById('ghStato');
  const mostra = (t, cls) => { if ($s) { $s.textContent = t; $s.className = 'stato-gh ' + cls; } };
  repo = repo.trim().replace(/^https?:\/\/github\.com\//, '').replace(/\/+$/, '').replace(/\.git$/, '');
  token = token.trim();
  if (!/^[\w.-]+\/[\w.-]+$/.test(repo)) { mostra('Il repo va scritto come utente/repo', 'err'); return; }
  if (!token) { mostra('Manca il token', 'err'); return; }
  const prima = { ...gh };
  gh = { repo, token };
  mostra('Verifico…', '');
  try {
    const info = await ghReq('GET', '');
    if (!info) throw Object.assign(new Error(spiegaErrore(404)), { status: 404 });
    if (!info.permissions || !info.permissions.push) throw Object.assign(new Error(spiegaErrore(403)), { status: 403 });
    salvaGh();
    mostra(`Collegato a ${repo}${info.private ? '' : ' (repo pubblico: i salvataggi sono visibili a tutti)'}`, 'ok');
    avviso('GitHub collegato');
    await ricaricaRemoto();
    rinfresca();
  } catch (e) {
    gh = prima;
    mostra(e.message, 'err');
  }
}
function scollegaGh() {
  gh = { repo: '', token: '' }; salvaGh();
  snapRemoti = []; correnteRemoto = null; statoGh.errore = ''; statoGh.aggiornato = null;
  setAll('.nSnap', lista().length);
  avviso('GitHub scollegato: le strategie tornano locali');
  rinfresca();
}

const PANNELLI = { salvataggi: pannelloSnap, impostazioni: pannelloImpostazioni, github: pannelloGitHub, salva: pannelloSalva };

/* apre un pannello per nome; quello attuale finisce nella pila per Indietro */
function apri(nome) {
  if (pannelloAperto && pannelloAperto !== nome) pila.push(pannelloAperto);
  pannelloAperto = nome;
  $overlay.innerHTML = PANNELLI[nome]();
  $overlay.hidden = false;
  aggiorna();
  if (nome === 'salvataggi' && remoto()) ricaricaRemoto();
  if (nome === 'salva') { const $n = document.getElementById('nomeSnap'); if ($n) $n.focus(); }
}
/* ridisegna il pannello aperto senza toccare la pila */
function rinfresca() {
  if (!pannelloAperto || $overlay.hidden) return;
  $overlay.innerHTML = PANNELLI[pannelloAperto]();
  aggiorna();
}
/* come rinfresca, ma non interrompe chi sta scrivendo un nome */
function rinfrescaSeLibero() {
  const a = document.activeElement;
  if (a && (a.classList.contains('snome') || a.id === 'nomeSnap' || a.id === 'ghToken' || a.id === 'ghRepo')) return;
  rinfresca();
}
function indietro() {
  const p = pila.pop();
  if (!p) { chiudiSnap(); return; }
  pannelloAperto = p;
  $overlay.innerHTML = PANNELLI[p]();
  aggiorna();
}
function apriSnap() { apri('salvataggi'); }
function chiudiSnap() { pannelloAperto = null; pila = []; $overlay.hidden = true; $overlay.innerHTML = ''; }

/* legge il nome scritto nel pannello e crea la strategia, poi mostra la lista */
async function salvaConNome(bottone) {
  const $n = document.getElementById('nomeSnap');
  const nome = ($n ? $n.value : '').trim() || `Strategia ${lista().length + 1}`;
  if (bottone) { bottone.disabled = true; bottone.textContent = 'Salvo…'; }
  salvaSubito();
  const creata = await creaSnap(nome, stato);
  if (creata) {
    impostaAttuale(creata);
    avviso(`Salvata: ${nome}`);
    if (pila[pila.length - 1] === 'salvataggi') pila.pop();
    pannelloAperto = 'salvataggi'; rinfresca();
  } else if (bottone) { bottone.disabled = false; bottone.textContent = 'Salva'; }
}

function esporta() {
  const dati = { app: 'FantaManager', versione: 1, esportato: new Date().toISOString(), corrente: stato, salvataggi: lista().map(fileSnap) };
  const blob = new Blob([JSON.stringify(dati, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  const d = new Date(), pad = n => String(n).padStart(2, '0');
  a.href = URL.createObjectURL(blob);
  a.download = `fantamanager-${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.json`;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

function importa(file) {
  const fr = new FileReader();
  fr.onload = async () => {
    let nuovi = [];
    try {
      const d = JSON.parse(fr.result);
      const presenti = lista();
      if (Array.isArray(d.salvataggi)) {
        d.salvataggi.forEach(s => {
          const st = pulisci(s.stato);
          const id = String(s.id || nuovoId()).replace(/[^\w.-]/g, '');
          if (!st || !id || presenti.some(x => x.id === id) || nuovi.some(x => x.id === id)) return;
          nuovi.push({ id, nome: String(s.nome ?? 'Importato'), data: String(s.data || d.esportato || new Date().toISOString()), stato: st });
        });
      }
      const corrente = pulisci(d.corrente) || (Array.isArray(d.salvataggi) ? null : pulisci(d));
      if (corrente) nuovi.push({ id: nuovoId(), nome: 'Importato · stato corrente', data: String(d.esportato || new Date().toISOString()), stato: corrente });
    } catch (e) { avviso('File non valido'); return; }
    if (nuovi.length === 0) { avviso('Nessun salvataggio nuovo nel file'); return; }
    let n = 0;
    for (const s of nuovi) { if (await aggiungiSnap(s)) n++; else break; }
    rinfresca();
    avviso(n === 1 ? '1 salvataggio importato' : `${n} salvataggi importati`);
  };
  fr.readAsText(file);
}

/* secondo click entro 4 secondi per confermare */
const attese = new Map();
function conferma(b, testo, fn) {
  if (attese.has(b)) { clearTimeout(attese.get(b)); attese.delete(b); fn(); return; }
  const icona = b.classList.contains('ico');          // i pulsanti icona cambiano solo colore
  const orig = b.textContent;
  if (!icona) b.textContent = testo;
  b.classList.add('att');
  attese.set(b, setTimeout(() => {
    attese.delete(b); if (!icona) b.textContent = orig; b.classList.remove('att');
  }, 4000));
}

/* ——— strategia in vista: quella caricata o salvata per ultima ——— */
let attuale = null;   // { id, nome } oppure null
try { const a = JSON.parse(localStorage.getItem('asta.attuale')); if (a && a.id) attuale = { id: String(a.id), nome: String(a.nome ?? '') }; } catch (e) { /* nessuna */ }
function impostaAttuale(s) {
  attuale = s ? { id: s.id, nome: s.nome } : null;
  try { attuale ? localStorage.setItem('asta.attuale', JSON.stringify(attuale)) : localStorage.removeItem('asta.attuale'); } catch (e) { /* niente */ }
  scriviAttuale();
}
function nomeAttuale() {
  if (!attuale) return null;
  const s = lista().find(x => x.id === attuale.id);
  return (s ? s.nome : attuale.nome) || 'Senza nome';
}
function scriviAttuale() {
  const pieniOra = stato.ruoli.some(r => r.slot.some(x => x.p !== null || x.l !== null));
  const nome = nomeAttuale() || (pieniOra ? 'Non salvata' : 'Nuova strategia');
  document.querySelectorAll('.mNome').forEach(el => { el.textContent = nome; el.classList.toggle('vuota', !attuale); });
  document.querySelectorAll('[data-az="cestina"]').forEach(b => { b.disabled = !attuale; });
}

/* cambia il numero di slot di un reparto. Se si riduce, toglie prima gli slot vuoti dal fondo;
   se tocca eliminare slot con valori lo dice. */
function ridimensiona(ri, n) {
  const r = stato.ruoli[ri];
  if (n === r.slot.length) return;
  let persi = 0;
  while (r.slot.length < n) r.slot.push({ p: null, l: null });
  while (r.slot.length > n) {
    let i = r.slot.length - 1;
    while (i >= 0 && (r.slot[i].p !== null || r.slot[i].l !== null)) i--;
    if (i < 0) { i = r.slot.length - 1; persi++; }
    r.slot.splice(i, 1);
  }
  if (reparto >= stato.ruoli.length) reparto = 0;
  disegna(); salva();
  if (persi) avviso(persi === 1 ? `${r.nome}: tolto 1 slot con valori` : `${r.nome}: tolti ${persi} slot con valori`);
}

/* ——— eventi ——— */
const timerRinomina = new Map();
document.addEventListener('input', e => {
  const el = e.target;
  if (el.classList.contains('budget')) { stato.budget = num(el.value) ?? 0; aggiorna(el); salva(); return; }
  if (el.classList.contains('nslot')) {
    const n = parseInt(el.value, 10);
    if (!Number.isInteger(n) || n < 1 || n > 30) return;   // mentre si scrive può essere vuoto: si aspetta
    ridimensiona(+el.dataset.r, n);
    return;
  }
  if (el.dataset.rinomina !== undefined) {
    const s = lista().find(x => x.id === el.dataset.rinomina);
    if (!s) return;
    s.nome = el.value;
    clearTimeout(timerRinomina.get(s.id));
    timerRinomina.set(s.id, setTimeout(() => aggiornaSnap(s, {}, `Rinominato: ${s.nome || s.id}`), remoto() ? 1200 : 350));
    return;
  }
  if (!el.classList.contains('f')) return;
  const slot = stato.ruoli[+el.dataset.r].slot[+el.dataset.s];
  const v = num(el.value);
  slot[el.dataset.k] = v === null ? null
    : (el.dataset.t === 'cr' ? v : (v / 100) * stato.budget);
  aggiorna(el); salva();
});

document.addEventListener('blur', e => {
  if (e.target.classList && e.target.classList.contains('f')) aggiorna();
}, true);

document.addEventListener('change', e => {
  if (e.target.id === 'importa' && e.target.files[0]) importa(e.target.files[0]);
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$overlay.hidden) chiudiSnap();
  if (e.key === 'Enter' && e.target.id === 'nomeSnap') { e.preventDefault(); salvaConNome(document.querySelector('[data-az="salvaNome"]')); }
});

document.addEventListener('click', e => {

  const un = e.target.closest('[data-unita]');
  if (un) {
    unita = unita === 'cr' ? 'pc' : 'cr';
    try { localStorage.setItem('asta.unita', unita); } catch (err) { /* niente */ }
    un.textContent = unita === 'cr' ? 'cr' : '%';
    aggiorna(); return;
  }

  const mtab = e.target.closest('[data-reparto]');
  if (mtab) {
    reparto = +mtab.dataset.reparto;
    document.querySelectorAll('.mtab').forEach(b => b.classList.toggle('on', +b.dataset.reparto === reparto));
    document.querySelectorAll('.block').forEach(b => b.classList.toggle('on', +b.dataset.ri === reparto));
    return;
  }

  const az = e.target.closest('[data-az]');
  if (az && az.dataset.az === 'salva') { apri('salva'); return; }
  if (az && az.dataset.az === 'salvaNome') { salvaConNome(az); return; }
  if (az && az.dataset.az === 'indietro') { indietro(); return; }
  if (az && az.dataset.az === 'azzera') {
    conferma(az, 'Confermi?', () => { stato = iniziale(); impostaAttuale(null); disegna(); salvaSubito(); chiudiSnap(); avviso('Asta azzerata'); });
    return;
  }
  if (az && az.dataset.az === 'cestina') {
    if (!attuale) return;
    conferma(az, '', () => {
      const s = lista().find(x => x.id === attuale.id);
      const nome = nomeAttuale();
      const fine = () => { impostaAttuale(null); avviso(`Strategia eliminata: ${nome}`); };
      if (s) eliminaSnap(s).then(ok => { if (ok) fine(); }); else fine();
    });
    return;
  }
  if (az && az.dataset.az === 'sincronizza') {
    az.disabled = true; az.textContent = 'Invio…';
    sincronizzaCorrente().then(() => rinfresca());
    return;
  }
  if (az && az.dataset.az === 'migra') {
    az.disabled = true;
    migraLocali().then(() => rinfresca());
    return;
  }
  if (az && az.dataset.az === 'ghCollega') {
    az.disabled = true;
    collegaGh(document.getElementById('ghRepo').value, document.getElementById('ghToken').value).then(() => { az.disabled = false; });
    return;
  }
  if (az && az.dataset.az === 'ghScollega') { conferma(az, 'Confermi?', scollegaGh); return; }

  const daAprire = e.target.closest('[data-apri]');
  if (daAprire) { apri(daAprire.dataset.apri); return; }
  if (e.target.closest('[data-chiudi]') || e.target === $overlay) { chiudiSnap(); return; }
  if (e.target.id === 'esporta') { esporta(); return; }

  /* carica al primo tocco; l'avviso offre Annulla per qualche secondo */
  const carica = e.target.closest('[data-carica]');
  if (carica) {
    const id = carica.dataset.carica;
    const s = id === 'corrente' ? correnteRemoto && { nome: 'stato corrente sincronizzato', stato: correnteRemoto.stato } : lista().find(x => x.id === id);
    if (!s) return;
    const prima = clona(stato), attualePrima = attuale;
    stato = clona(s.stato);
    impostaAttuale(id === 'corrente' ? null : s);
    disegna(); salvaSubito(); chiudiSnap();
    avviso(`Caricata: ${s.nome || 'senza nome'}`, 'Annulla', () => { stato = prima; impostaAttuale(attualePrima); disegna(); salvaSubito(); avviso('Ripristinato'); });
    return;
  }
  const sovrascrivi = e.target.closest('[data-sovrascrivi]');
  if (sovrascrivi) {
    conferma(sovrascrivi, 'Sovrascrivo?', () => {
      const s = lista().find(x => x.id === sovrascrivi.dataset.sovrascrivi);
      if (!s) return;
      aggiornaSnap(s, { stato: clona(stato), data: new Date().toISOString() }, `Aggiornato: ${s.nome || s.id}`)
        .then(ok => { if (ok) { impostaAttuale(s); avviso(`Aggiornata: ${s.nome || 'senza nome'}`); } rinfresca(); });
    });
    return;
  }
  const elimina = e.target.closest('[data-elimina]');
  if (elimina) {
    conferma(elimina, 'Elimino?', () => {
      const s = lista().find(x => x.id === elimina.dataset.elimina);
      if (s) eliminaSnap(s).then(() => rinfresca());
    });
    return;
  }
});

if (remoto()) ricaricaRemoto();

disegna();
</script>
</body>
</html>
